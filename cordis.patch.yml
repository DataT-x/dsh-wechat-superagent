# ============================================================================
# dsh-wechat-superagent —— DSH bundle patch
# ============================================================================
# 插件挂载声明：DSH 启动时把本插件插进 profile 的配置树。
#
# 本地安装（link 到源码目录）：
#   dsh plugin --profile desktop add "link:D:\project\dsh-wechat-superagent"
#
# ⚠️ `name:` 必须与安装后的包名完全一致（@datat-x/dsh-wechat-superagent），
#    否则表现为「装上了但服务起不来」。
# ============================================================================
- insert:
  - id: dsh-wechat-superagent
    name: '@datat-x/dsh-wechat-superagent'
